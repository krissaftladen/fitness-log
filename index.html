<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    max-width: 700px; margin: 0 auto; padding: 20px 18px; padding-bottom: 90px;
    background: #0a0a0a; color: #f2f2f2; font-size: 16px;
  }
  h2 { font-weight: 800; font-size: 28px; margin-bottom: 16px; letter-spacing: -0.5px; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; background: #161616; padding: 6px; border-radius: 16px; }
  .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 15px; font-weight: 700;
             color: #888; cursor: pointer; border-radius: 12px; transition: 0.15s; }
  .tab-btn.active { background: #2a2a2a; color: #fff; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Stats top */
  .stats-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-box { flex: 1; min-width: 90px; background: #161616; border-radius: 18px; padding: 12px 8px; text-align: center; }
  .stat-box .label { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-box .value { font-size: 18px; font-weight: 800; margin-top: 4px; color: #f2f2f2; }
  .stat-ok { color: #3ddc84 !important; }
  .stat-bad { color: #ff5c5c !important; }

  /* Graph */
  .graph-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .graph-header strong { font-size: 16px; font-weight: 800; }
  canvas { border-radius: 18px; background: #161616; width: 100%; margin-top: 4px; }

  /* Selector buttons above table */
  .select-btn-row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-start; }
  .select-btn { padding: 8px 16px; border: none; background: #161616; color: #aaa; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 700; }
  .select-btn.active { background: #f2f2f2; color: #0a0a0a; }

  /* Table -> card list feel */
  table { border-collapse: collapse; width: 100%; margin-top: 14px; background: #161616; border-radius: 18px; overflow: hidden; }
  td, th { border: none; border-bottom: 1px solid #232323; padding: 10px 14px; font-size: 14px; text-align: left; color: #ddd; }
  th { color: #888; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; background: #1c1c1c; }
  tr:last-child td { border-bottom: none; }

  /* Training exercise table */
  .ex-table-wrap { margin-top: 14px; background: #161616; border-radius: 18px; overflow-x: auto; }
  .ex-table { width: 100%; border-collapse: collapse; }
  .ex-table th { color: #888; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
                 background: #1c1c1c; padding: 10px 8px; text-align: left; white-space: nowrap; }
  .ex-table td { padding: 10px 8px; border-bottom: 1px solid #232323; font-size: 14px; color: #ddd; white-space: nowrap; }
  .ex-table tr:last-child td { border-bottom: none; }
  .ex-table td.ex-name-cell { white-space: normal; font-weight: 700; color: #f2f2f2; }
  .ex-cell { cursor: pointer; border-radius: 8px; padding: 4px 6px; display: inline-block; min-width: 32px; }
  .ex-cell:active { background: #232323; }
  .ex-cell.empty { color: #555; }
  .ex-edit-input { width: 64px; padding: 6px 8px; background: #232323; border: 1px solid #3ddc84;
                   border-radius: 8px; color: #f2f2f2; font-size: 14px; }
  .ex-edit-input::placeholder { color: #666; opacity: 1; }
  .ex-edit-hint { font-size: 10px; color: #3ddc84; display: block; margin-top: 2px; white-space: nowrap; }
  .ex-del-btn { background: none; border: none; color: #555; font-size: 16px; cursor: pointer; padding: 4px 6px; }
  .ex-del-btn:active { color: #ff5c5c; }
  .ex-empty-hint { padding: 20px 14px; color: #666; font-size: 14px; text-align: center; }
  .ex-drag-handle { cursor: grab; color: #555; font-size: 18px; padding: 4px 8px; touch-action: none; user-select: none; }
  .ex-table tr.dragging { opacity: 0.4; }

  /* Floating plus button */
  .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: calc(24px + env(safe-area-inset-right));
         width: 58px; height: 58px; border-radius: 50%; z-index: 500;
         background: #f2f2f2; color: #0a0a0a; font-size: 30px; font-weight: 700; border: none; cursor: pointer;
         box-shadow: 0 4px 14px rgba(0,0,0,0.5); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: #161616; color: #f2f2f2; padding: 24px; border-radius: 22px; width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { font-weight: 800; margin-top: 0; }
  .modal label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; color: #aaa; }
  .modal input, .modal select {
    width: 100%; padding: 10px; margin-top: 4px; background: #232323; border: 1px solid #333;
    border-radius: 10px; color: #f2f2f2; font-size: 14px;
  }
  .modal-actions { margin-top: 18px; display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
  .modal-actions button:first-child { background: #232323; color: #ccc; }
  .modal-actions button:last-child { background: #3ddc84; color: #0a0a0a; }
</style>
</head>
<body>

<h2>Fitness Log</h2>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('start')">Start</button>
  <button class="tab-btn" onclick="switchTab('training')">Training</button>
</div>

<!-- START TAB -->
<div id="tab-start" class="tab-content active">
  <label style="font-size:13px; font-weight:600; color:#aaa;">Datum
    <input type="date" id="startDate" onchange="onStartDateChange()" style="display:block; width:100%; padding:10px; margin-top:4px; background:#161616; border:none; border-radius:12px; color:#f2f2f2; font-size:14px;">
  </label>

  <div class="stats-row" id="statsRow" style="margin-top:14px;"></div>

  <div class="graph-header">
    <strong>Verlauf</strong>
  </div>
  <canvas id="mainChart" width="650" height="220"></canvas>

  <div class="select-btn-row">
    <button class="select-btn active" data-mode="gewicht" onclick="selectMode('gewicht')">Weight</button>
    <button class="select-btn" data-mode="oberarm" onclick="selectMode('oberarm')">Arms</button>
    <button class="select-btn" data-mode="brust" onclick="selectMode('brust')">Chest</button>
  </div>

  <table id="startTable">
    <thead><tr id="startTableHead"></tr></thead>
    <tbody id="startTableBody"></tbody>
  </table>
</div>

<!-- TRAINING TAB -->
<div id="tab-training" class="tab-content">
  <div class="select-btn-row">
    <button class="select-btn active" data-cat="push" onclick="selectTrainingCat('push')">Push</button>
    <button class="select-btn" data-cat="pull" onclick="selectTrainingCat('pull')">Pull</button>
    <button class="select-btn" data-cat="legs" onclick="selectTrainingCat('legs')">Legs</button>
  </div>
  <div class="ex-table-wrap">
    <table class="ex-table">
      <thead><tr><th></th><th>Übung</th><th>Sätze</th><th>Wdh</th><th>Gewicht</th><th></th></tr></thead>
      <tbody id="trainingTableBody"></tbody>
    </table>
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- MODAL: Start tab entry (context-sensitive) -->
<div class="modal-overlay" id="startModal">
  <div class="modal">
    <h3 id="startModalTitle">Eintragen</h3>
    <label>Datum <input type="date" id="m_datum"></label>

    <label id="m_field_label">Gewicht (kg)</label>
    <input type="number" step="0.1" id="m_value">

    <div class="modal-actions">
      <button onclick="closeModal('startModal')">Abbrechen</button>
      <button onclick="saveStartEntry()">Speichern</button>
    </div>
  </div>
</div>

<!-- MODAL: Training tab - neue Übung hinzufügen (nur Name) -->
<div class="modal-overlay" id="exerciseModal">
  <div class="modal">
    <h3>Übung hinzufügen</h3>
    <label>Name der Übung <input type="text" id="ex_new_name" placeholder="z.B. Legpress" autocomplete="off"></label>
    <div class="modal-actions">
      <button onclick="closeModal('exerciseModal')">Abbrechen</button>
      <button onclick="saveNewExercise()">Hinzufügen</button>
    </div>
  </div>
</div>

<script>
const DAILY_KEY = "fl_daily";           // gewicht, maße
const OLD_TRAINING_KEY = "fl_training"; // altes Format (Migration)
const EX_LIST_KEY = "fl_exercises";     // { id, category, name, sets, reps: [], weight: [], datum }

function loadJSON(key) { return JSON.parse(localStorage.getItem(key) || "[]"); }
function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function todayStr() {
  const d = new Date();
  return d.toISOString().split("T")[0];
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function formatDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y.slice(2)}`;
}

function formatWeightList(arr) {
  const unique = [...new Set(arr)];
  if (unique.length === 1) return `${unique[0]}kg`;
  return arr.map(v => `${v}kg`).join(" | ");
}

// ---------- MIGRATION: altes Trainings-Format -> neue Übungsliste ----------
function migrateOldTrainingIfNeeded() {
  if (localStorage.getItem(EX_LIST_KEY)) return; // schon migriert
  const old = loadJSON(OLD_TRAINING_KEY);
  if (!old.length) { saveJSON(EX_LIST_KEY, []); return; }

  // pro Kategorie+Name nur den neuesten Eintrag übernehmen
  const map = {};
  old.sort((a, b) => a.datum.localeCompare(b.datum)).forEach(day => {
    (day.exercises || []).forEach(ex => {
      const key = day.category + "||" + ex.name;
      const sets = parseInt(ex.sets, 10) || 1;
      map[key] = {
        id: uid(),
        category: day.category,
        name: ex.name,
        sets: sets,
        reps: Array.from({ length: sets }, () => ex.reps || ""),
        weight: Array.from({ length: sets }, () => ex.weight || ""),
        datum: day.datum
      };
    });
  });
  saveJSON(EX_LIST_KEY, Object.values(map));
}

let currentTab = "start";
let currentStartDate = todayStr();

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  event.target.classList.add("active");
  if (tab === "training") renderTrainingTable();
}

function onStartDateChange() {
  currentStartDate = document.getElementById("startDate").value || todayStr();
  renderStats();
}

// ---------- MODE (Weight/Arms/Chest) ----------
let currentMode = "gewicht";
const MODE_LABELS = { gewicht: "Gewicht (kg)", oberarm: "Oberarmumfang (cm)", brust: "Brustumfang (cm)" };
const MODE_FIELD = { gewicht: "gewicht", oberarm: "oberarm", brust: "brust" };

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll("#tab-start .select-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  renderStartTable();
  renderChart();
}

// ---------- TRAINING CATEGORY (Push/Pull/Legs) ----------
let currentTrainingCat = "push";
function selectTrainingCat(cat) {
  currentTrainingCat = cat;
  editState = null;
  document.querySelectorAll("#tab-training .select-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
  renderTrainingTable();
}

// ---------- MODAL HANDLING ----------
function openModal() {
  if (currentTab === "start") {
    document.getElementById("m_datum").value = currentStartDate;
    document.getElementById("m_field_label").textContent = MODE_LABELS[currentMode];
    document.getElementById("m_value").value = "";
    document.getElementById("startModal").classList.add("active");
  } else {
    document.getElementById("ex_new_name").value = "";
    document.getElementById("exerciseModal").classList.add("active");
    setTimeout(() => document.getElementById("ex_new_name").focus(), 50);
  }
}
function closeModal(id) {
  document.getElementById(id).classList.remove("active");
}

// ---------- START TAB: SAVE ----------
function saveStartEntry() {
  const datum = document.getElementById("m_datum").value;
  if (!datum) { alert("Bitte Datum wählen."); return; }

  const fieldName = MODE_FIELD[currentMode];
  const entry = {
    datum,
    [fieldName]: document.getElementById("m_value").value || null
  };

  let entries = loadJSON(DAILY_KEY);
  const idx = entries.findIndex(e => e.datum === datum);
  if (idx >= 0) entries[idx] = { ...entries[idx], ...entry };
  else entries.push(entry);
  entries.sort((a, b) => a.datum.localeCompare(b.datum));
  saveJSON(DAILY_KEY, entries);

  closeModal("startModal");
  renderAll();
}

// ---------- TRAINING TAB: Übungen verwalten ----------
function saveNewExercise() {
  const name = document.getElementById("ex_new_name").value.trim();
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  const list = loadJSON(EX_LIST_KEY);
  list.push({ id: uid(), category: currentTrainingCat, name, sets: null, reps: [], weight: [], datum: null });
  saveJSON(EX_LIST_KEY, list);
  closeModal("exerciseModal");
  renderTrainingTable();
}

function deleteExercise(id) {
  const list = loadJSON(EX_LIST_KEY);
  const ex = list.find(e => e.id === id);
  if (ex && !confirm(`"${ex.name}" löschen?`)) return;
  saveJSON(EX_LIST_KEY, list.filter(e => e.id !== id));
  if (editState && editState.id === id) editState = null;
  renderTrainingTable();
}

// ---------- TRAINING TAB: Klick-zum-Bearbeiten mit Enter-Sprung ----------
// editState.stage: 'sets' | 'reps' | 'weight'
let editState = null;

function beginEdit(id, stage) {
  const list = loadJSON(EX_LIST_KEY);
  const ex = list.find(e => e.id === id);
  if (!ex) return;

  if (stage === "sets" || !ex.sets) {
    editState = { id, stage: "sets", index: 0, sets: null, tempReps: [], tempWeight: [],
                  prevSets: ex.sets || null, prevReps: ex.reps || [], prevWeight: ex.weight || [] };
  } else if (stage === "reps") {
    editState = { id, stage: "reps", index: 0, sets: ex.sets, tempReps: [], tempWeight: [],
                  prevSets: ex.sets, prevReps: ex.reps || [], prevWeight: ex.weight || [] };
  } else if (stage === "weight") {
    editState = { id, stage: "weight", index: 0, sets: ex.sets, tempReps: ex.reps.slice(), tempWeight: [],
                  prevSets: ex.sets, prevReps: ex.reps || [], prevWeight: ex.weight || [] };
  }
  renderTrainingTable();
}

function handleEditKey(e) {
  if (e.key === "Escape") { editState = null; renderTrainingTable(); return; }
  if (e.key !== "Enter") return;
  e.preventDefault();
  commitEditStep(e.target.value);
}

function commitEditStep(rawVal) {
  const list = loadJSON(EX_LIST_KEY);
  const idx = list.findIndex(e => e.id === editState.id);
  if (idx < 0) { editState = null; renderTrainingTable(); return; }

  if (editState.stage === "sets") {
    let n = parseInt(rawVal, 10);
    if (!n && editState.prevSets) n = editState.prevSets;
    if (!n || n < 1) { editState = null; renderTrainingTable(); return; }
    editState.sets = n;
    editState.stage = "reps";
    editState.index = 0;
    renderTrainingTable();
    return;
  }

  if (editState.stage === "reps") {
    let val = rawVal;
    if (val === "" && editState.prevReps[editState.index] !== undefined) val = editState.prevReps[editState.index];
    editState.tempReps[editState.index] = val;
    editState.index++;
    if (editState.index < editState.sets) { renderTrainingTable(); return; }
    editState.stage = "weight";
    editState.index = 0;
    renderTrainingTable();
    return;
  }

  if (editState.stage === "weight") {
    let val = rawVal;
    if (val === "" && editState.prevWeight[editState.index] !== undefined) val = editState.prevWeight[editState.index];
    editState.tempWeight[editState.index] = val;
    editState.index++;
    if (editState.index < editState.sets) { renderTrainingTable(); return; }
    // fertig -> speichern
    list[idx].sets = editState.sets;
    list[idx].reps = editState.tempReps;
    list[idx].weight = editState.tempWeight;
    list[idx].datum = todayStr();
    saveJSON(EX_LIST_KEY, list);
    editState = null;
    renderTrainingTable();
    return;
  }
}

// ---------- TRAINING TAB: Reihenfolge per Drag & Drop ----------
let dragId = null;

function onDragHandleDown(e, id) {
  e.preventDefault();
  dragId = id;
  document.addEventListener("pointermove", onDragMove);
  document.addEventListener("pointerup", onDragUp);
  renderTrainingTable();
}

function onDragMove(e) {
  if (!dragId) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const row = el && el.closest("tr[data-id]");
  if (!row) return;
  const targetId = row.dataset.id;
  if (targetId === dragId) return;

  const list = loadJSON(EX_LIST_KEY);
  const catList = list.filter(x => x.category === currentTrainingCat);
  const others = list.filter(x => x.category !== currentTrainingCat);
  const fromIdx = catList.findIndex(x => x.id === dragId);
  const toIdx = catList.findIndex(x => x.id === targetId);
  if (fromIdx < 0 || toIdx < 0) return;

  const [moved] = catList.splice(fromIdx, 1);
  catList.splice(toIdx, 0, moved);
  saveJSON(EX_LIST_KEY, others.concat(catList));
  renderTrainingTable();
}

function onDragUp() {
  dragId = null;
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragUp);
  renderTrainingTable();
}

// ---------- RENDER: STATS ----------
function renderStats() {
  const entries = loadJSON(DAILY_KEY);
  const last = entries[entries.length - 1] || {};

  const box = (label, value) => `
    <div class="stat-box">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
    </div>`;
  document.getElementById("statsRow").innerHTML =
    box("Gewicht", last.gewicht ? last.gewicht + " kg" : "-") +
    box("Oberarm", last.oberarm ? last.oberarm + " cm" : "-") +
    box("Brust", last.brust ? last.brust + " cm" : "-");
}

// ---------- RENDER: TABLE (Start tab, filtered by graph selection) ----------
function renderStartTable() {
  const mode = currentMode;
  const head = document.getElementById("startTableHead");
  const body = document.getElementById("startTableBody");

  if (mode === "gewicht") {
    head.innerHTML = "<th>Datum</th><th>Gewicht</th>";
    const entries = loadJSON(DAILY_KEY).filter(e => e.gewicht).sort((a, b) => b.datum.localeCompare(a.datum));
    body.innerHTML = entries.map(e => `<tr><td>${formatDate(e.datum)}</td><td>${e.gewicht} kg</td></tr>`).join("");
  } else if (mode === "oberarm") {
    head.innerHTML = "<th>Datum</th><th>Oberarm</th>";
    const entries = loadJSON(DAILY_KEY).filter(e => e.oberarm).sort((a, b) => b.datum.localeCompare(a.datum));
    body.innerHTML = entries.map(e => `<tr><td>${formatDate(e.datum)}</td><td>${e.oberarm} cm</td></tr>`).join("");
  } else if (mode === "brust") {
    head.innerHTML = "<th>Datum</th><th>Brust</th>";
    const entries = loadJSON(DAILY_KEY).filter(e => e.brust).sort((a, b) => b.datum.localeCompare(a.datum));
    body.innerHTML = entries.map(e => `<tr><td>${formatDate(e.datum)}</td><td>${e.brust} cm</td></tr>`).join("");
  }
}

// ---------- RENDER: TRAINING TABLE ----------
function renderTrainingTable() {
  const body = document.getElementById("trainingTableBody");
  const list = loadJSON(EX_LIST_KEY).filter(e => e.category === currentTrainingCat);

  if (!list.length) {
    body.innerHTML = `<tr><td colspan="6" class="ex-empty-hint">Noch keine Übungen. Mit + eine hinzufügen.</td></tr>`;
    return;
  }

  const editing = editState;

  body.innerHTML = list.map(ex => {
    const isEditingRow = editing && editing.id === ex.id;

    // ---- Sätze-Zelle ----
    let setsCell;
    if (isEditingRow && editing.stage === "sets") {
      setsCell = `<input class="ex-edit-input" id="editInput" type="number" inputmode="numeric" placeholder="${editing.prevSets || 'Sätze'}"
                    onkeydown="handleEditKey(event)">`;
    } else {
      setsCell = ex.sets
        ? `<span class="ex-cell" onclick="beginEdit('${ex.id}','sets')">${ex.sets}</span>`
        : `<span class="ex-cell empty" onclick="beginEdit('${ex.id}','sets')">-</span>`;
    }

    // ---- Wdh-Zelle ----
    let repsCell;
    if (isEditingRow && editing.stage === "reps") {
      repsCell = `<input class="ex-edit-input" id="editInput" type="number" inputmode="numeric"
                    placeholder="${editing.prevReps[editing.index] !== undefined ? editing.prevReps[editing.index] : 'Satz ' + (editing.index + 1)}" onkeydown="handleEditKey(event)">
                  <span class="ex-edit-hint">Satz ${editing.index + 1} von ${editing.sets}</span>`;
    } else if (ex.reps && ex.reps.length) {
      repsCell = `<span class="ex-cell" onclick="beginEdit('${ex.id}','reps')">${ex.reps.join(" | ")}</span>`;
    } else {
      repsCell = `<span class="ex-cell empty" onclick="beginEdit('${ex.id}','reps')">-</span>`;
    }

    // ---- Gewicht-Zelle ----
    let weightCell;
    if (isEditingRow && editing.stage === "weight") {
      weightCell = `<input class="ex-edit-input" id="editInput" type="number" step="0.5" inputmode="decimal"
                     placeholder="${editing.prevWeight[editing.index] !== undefined ? editing.prevWeight[editing.index] : 'Satz ' + (editing.index + 1)}" onkeydown="handleEditKey(event)">
                    <span class="ex-edit-hint">Satz ${editing.index + 1} von ${editing.sets}</span>`;
    } else if (ex.weight && ex.weight.length) {
      weightCell = `<span class="ex-cell" onclick="beginEdit('${ex.id}','weight')">${formatWeightList(ex.weight)}</span>`;
    } else {
      weightCell = `<span class="ex-cell empty" onclick="beginEdit('${ex.id}','weight')">-</span>`;
    }

    const isDragging = dragId === ex.id;

    return `<tr data-id="${ex.id}" class="${isDragging ? 'dragging' : ''}">
      <td><span class="ex-drag-handle" onpointerdown="onDragHandleDown(event,'${ex.id}')">⠿</span></td>
      <td class="ex-name-cell">${ex.name}</td>
      <td>${setsCell}</td>
      <td>${repsCell}</td>
      <td>${weightCell}</td>
      <td><button class="ex-del-btn" onclick="deleteExercise('${ex.id}')">✕</button></td>
    </tr>`;
  }).join("");

  const activeInput = document.getElementById("editInput");
  if (activeInput) activeInput.focus();
}

// ---------- CHART ----------
function renderChart() {
  const canvas = document.getElementById("mainChart");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth;
  const cssHeight = parseInt(canvas.getAttribute("height"), 10) || 220;
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  canvas.style.height = cssHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const mode = currentMode;
  const daily = loadJSON(DAILY_KEY);

  let points = [];
  if (mode === "gewicht") points = daily.filter(e => e.gewicht).map(e => ({ datum: e.datum, val: parseFloat(e.gewicht) }));
  else if (mode === "oberarm") points = daily.filter(e => e.oberarm).map(e => ({ datum: e.datum, val: parseFloat(e.oberarm) }));
  else if (mode === "brust") points = daily.filter(e => e.brust).map(e => ({ datum: e.datum, val: parseFloat(e.brust) }));

  const padding = 30;
  const chartH = cssHeight - padding - 20;
  const w = cssWidth - padding * 2;

  // Build a date -> x mapping based on actual elapsed time, not index position
  const allDates = daily.map(e => e.datum);
  let xForDate = () => padding;
  if (allDates.length > 0) {
    const times = allDates.map(d => new Date(d).getTime());
    const minT = Math.min(...times);
    const maxT = Math.max(...times);
    const span = maxT - minT || 1;
    xForDate = (datum) => padding + ((new Date(datum).getTime() - minT) / span) * w;
  }

  if (points.length < 2) {
    ctx.fillStyle = "#888";
    ctx.fillText("Mindestens 2 Einträge nötig für Diagramm.", 10, 100);
  } else {
    const vals = points.map(p => p.val);
    const min = Math.min(...vals) - 1;
    const max = Math.max(...vals) + 1;

    ctx.beginPath();
    ctx.strokeStyle = "#333333";
    ctx.moveTo(padding, 10);
    ctx.lineTo(padding, chartH);
    ctx.lineTo(cssWidth - padding, chartH);
    ctx.stroke();

    ctx.beginPath();
    ctx.strokeStyle = "#3ddc84";
    ctx.lineWidth = 2;
    points.forEach((p, i) => {
      const x = xForDate(p.datum);
      const y = chartH - ((p.val - min) / (max - min)) * (chartH - 20);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.lineWidth = 1;

    ctx.fillStyle = "#888888";
    ctx.fillText(max.toFixed(1), 2, 15);
    ctx.fillText(min.toFixed(1), 2, chartH);
  }
}

function renderAll() {
  renderStats();
  renderStartTable();
  renderChart();
}

migrateOldTrainingIfNeeded();
document.getElementById("startDate").value = todayStr();
renderAll();
</script>
